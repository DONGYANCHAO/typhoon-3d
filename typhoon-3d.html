<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Interactive 3D Typhoon Path Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #container {
            display: flex;
            height: 100vh;
        }

        #canvas-container {
            flex: 1;
            position: relative;
        }

        canvas {
            display: block;
        }

        /* 右侧数据面板 */
        #info-panel {
            width: 380px;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            border-left: 2px solid #0f3460;
            padding: 20px;
            overflow-y: auto;
            color: #fff;
        }

        .panel-header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 2px solid #0f3460;
            margin-bottom: 20px;
        }

        .panel-header h1 {
            font-size: 24px;
            color: #e94560;
            margin-bottom: 10px;
        }

        .typhoon-level {
            display: inline-block;
            padding: 8px 16px;
            background: #0f3460;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .typhoon-level.warning {
            animation: warning-flash 1s infinite;
        }

        @keyframes warning-flash {
            0%, 100% {
                border-color: transparent;
                box-shadow: 0 0 10px rgba(233, 69, 96, 0);
            }
            50% {
                border-color: #e94560;
                box-shadow: 0 0 20px rgba(233, 69, 96, 0.8);
            }
        }

        .data-section {
            margin-bottom: 25px;
        }

        .data-section h3 {
            color: #e94560;
            margin-bottom: 15px;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .data-section h3::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 16px;
            background: #e94560;
            border-radius: 2px;
        }

        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .data-item {
            background: rgba(15, 52, 96, 0.3);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(15, 52, 96, 0.5);
            transition: all 0.3s ease;
        }

        .data-item.highlight {
            background: rgba(233, 69, 96, 0.3);
            border-color: #e94560;
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.5);
            transform: scale(1.05);
        }

        .data-item .label {
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
        }

        .data-item .value {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
        }

        .data-item .value.warning {
            color: #e94560;
        }

        .path-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .path-item {
            display: flex;
            align-items: center;
            padding: 10px;
            margin-bottom: 8px;
            background: rgba(15, 52, 96, 0.2);
            border-radius: 8px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .path-item:hover {
            background: rgba(15, 52, 96, 0.4);
            border-color: #0f3460;
        }

        .path-item.active {
            background: rgba(233, 69, 96, 0.2);
            border-color: #e94560;
        }

        .path-item .time {
            font-size: 12px;
            color: #888;
            width: 80px;
        }

        .path-item .coords {
            font-size: 13px;
            color: #ccc;
            flex: 1;
        }

        .path-item .wind {
            font-size: 14px;
            font-weight: bold;
            color: #e94560;
        }

        /* 3D场景中的UI */
        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
        }

        .legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #0f3460;
            color: #fff;
        }

        .legend h4 {
            margin-bottom: 10px;
            color: #e94560;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            border-radius: 3px;
        }

        .warning-indicator {
            position: absolute;
            top: 20px;
            right: 400px;
            background: rgba(233, 69, 96, 0.9);
            padding: 15px 25px;
            border-radius: 10px;
            display: none;
            animation: pulse 1s infinite;
            color: #fff;
        }

        .warning-indicator.show {
            display: block;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.05);
            }
        }

        .warning-indicator h3 {
            color: #fff;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .warning-indicator p {
            color: #ffd;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="canvas-container">
            <div class="ui-overlay">
                <div>鼠标悬停路径节点查看数据</div>
                <div>Keys 1-5: 改变风力强度</div>
            </div>

            <div class="warning-indicator" id="warningIndicator">
                <h3>⚠️ 台风预警</h3>
                <p>检测到极端天气条件</p>
            </div>

            <div class="legend">
                <h4>图例</h4>
                <div class="legend-item">
                    <div class="legend-color" style="background: #ff6b35;"></div>
                    <span>历史路径</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #4ecdc4;"></div>
                    <span>螺旋云墙</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #ffe66d;"></div>
                    <span>台风眼</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #e94560;"></div>
                    <span>预警区域</span>
                </div>
            </div>
        </div>

        <div id="info-panel">
            <div class="panel-header">
                <h1>台风监测中心</h1>
                <div class="typhoon-level" id="typhoonLevel">超强台风</div>
            </div>

            <div class="data-section">
                <h3>实时数据</h3>
                <div class="data-grid">
                    <div class="data-item" id="windSpeedItem">
                        <div class="label">风速</div>
                        <div class="value" id="windSpeed">55 m/s</div>
                    </div>
                    <div class="data-item" id="pressureItem">
                        <div class="label">气压</div>
                        <div class="value" id="pressure">920 hPa</div>
                    </div>
                    <div class="data-item">
                        <div class="label">移动速度</div>
                        <div class="value" id="moveSpeed">18 km/h</div>
                    </div>
                    <div class="data-item">
                        <div class="label">移动方向</div>
                        <div class="value" id="moveDirection">西北</div>
                    </div>
                    <div class="data-item">
                        <div class="label">七级风圈</div>
                        <div class="value" id="windRadius7">280 km</div>
                    </div>
                    <div class="data-item">
                        <div class="label">十级风圈</div>
                        <div class="value" id="windRadius10">120 km</div>
                    </div>
                </div>
            </div>

            <div class="data-section">
                <h3>位置信息</h3>
                <div class="data-grid">
                    <div class="data-item">
                        <div class="label">经度</div>
                        <div class="value" id="longitude">125.5°E</div>
                    </div>
                    <div class="data-item">
                        <div class="label">纬度</div>
                        <div class="value" id="latitude">22.3°N</div>
                    </div>
                </div>
            </div>

            <div class="data-section">
                <h3>历史路径</h3>
                <div class="path-list" id="pathList">
                    <!-- 动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
    ( function () {

	// OrbitControls implementation
	const _changeEvent = { type: 'change' };
	const _startEvent = { type: 'start' };
	const _endEvent = { type: 'end' };

	class OrbitControls extends THREE.EventDispatcher {
		constructor( object, domElement ) {
			super();
			if ( domElement === undefined ) console.warn( 'THREE.OrbitControls: The second parameter "domElement" is now mandatory.' );
			if ( domElement === document ) console.error( 'THREE.OrbitControls: "document" should not be used as the target "domElement". Please use "renderer.domElement" instead.' );
			this.object = object;
			this.domElement = domElement;
			this.enabled = true;
			this.target = new THREE.Vector3();
			this.minDistance = 0;
			this.maxDistance = Infinity;
			this.minZoom = 0;
			this.maxZoom = Infinity;
			this.minPolarAngle = 0;
			this.maxPolarAngle = Math.PI;
			this.minAzimuthAngle = - Infinity;
			this.maxAzimuthAngle = Infinity;
			this.enableDamping = false;
			this.dampingFactor = 0.05;
			this.enableZoom = true;
			this.zoomSpeed = 1.0;
			this.enableRotate = true;
			this.rotateSpeed = 1.0;
			this.enablePan = true;
			this.panSpeed = 1.0;
			this.screenSpacePanning = true;
			this.keyPanSpeed = 7.0;
			this.autoRotate = false;
			this.autoRotateSpeed = 2.0;
			this.keys = { LEFT: 'ArrowLeft', UP: 'ArrowUp', RIGHT: 'ArrowRight', BOTTOM: 'ArrowDown' };
			this.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
			this.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
			this.target0 = this.target.clone();
			this.position0 = this.object.position.clone();
			this.zoom0 = this.object.zoom;
			this._domElementKeyEvents = null;

			this.getPolarAngle = function () { return spherical.phi; };
			this.getAzimuthalAngle = function () { return spherical.theta; };

			this.listenToKeyEvents = function ( domElement ) {
				domElement.addEventListener( 'keydown', onKeyDown );
				this._domElementKeyEvents = domElement;
			};

			this.saveState = function () {
				scope.target0.copy( scope.target );
				scope.position0.copy( scope.object.position );
				scope.zoom0 = scope.object.zoom;
			};

			this.reset = function () {
				scope.target.copy( scope.target0 );
				scope.object.position.copy( scope.position0 );

				scope.dispatchEvent( _changeEvent );
				scope.update();
				state = STATE.NONE;
			};

			this.update = function () {
				const offset = new THREE.Vector3();
				const quat = new THREE.Quaternion().setFromUnitVectors( object.up, new THREE.Vector3( 0, 1, 0 ) );
				const quatInverse = quat.clone().invert();
				const lastPosition = new THREE.Vector3();
				const lastQuaternion = new THREE.Quaternion();
				const twoPI = 2 * Math.PI;
				return function update() {
					const position = scope.object.position;
					offset.copy( position ).sub( scope.target );
					offset.applyQuaternion( quat );
					spherical.setFromVector3( offset );
					if ( scope.autoRotate && state === STATE.NONE ) rotateLeft( getAutoRotationAngle() );
					if ( scope.enableDamping ) {
						spherical.theta += sphericalDelta.theta * scope.dampingFactor;
						spherical.phi += sphericalDelta.phi * scope.dampingFactor;
					} else {
						spherical.theta += sphericalDelta.theta;
						spherical.phi += sphericalDelta.phi;
					}
					let min = scope.minAzimuthAngle;
					let max = scope.maxAzimuthAngle;
					if ( isFinite( min ) && isFinite( max ) ) {
						if ( min < - Math.PI ) min += twoPI; else if ( min > Math.PI ) min -= twoPI;
						if ( max < - Math.PI ) max += twoPI; else if ( max > Math.PI ) max -= twoPI;
						if ( min <= max ) {
							spherical.theta = Math.max( min, Math.min( max, spherical.theta ) );
						} else {
							spherical.theta = spherical.theta > ( min + max ) / 2 ? Math.max( min, spherical.theta ) : Math.min( max, spherical.theta );
						}
					}
					spherical.phi = Math.max( scope.minPolarAngle, Math.min( scope.maxPolarAngle, spherical.phi ) );

					spherical.radius = Math.max( scope.minDistance, Math.min( scope.maxDistance, spherical.radius ) );

						sphericalDelta.phi *= 1 - scope.dampingFactor;

					} else {

						panOffset.set( 0, 0, 0 );

						lastPosition.copy( scope.object.position );
						lastQuaternion.copy( scope.object.quaternion );

				scope.domElement.removeEventListener( 'touchstart', onTouchStart );
				scope.domElement.removeEventListener( 'touchend', onTouchEnd );
				scope.domElement.removeEventListener( 'touchmove', onTouchMove );
				scope.domElement.ownerDocument.removeEventListener( 'pointermove', onPointerMove );
				scope.domElement.ownerDocument.removeEventListener( 'pointerup', onPointerUp );
				if ( scope._domElementKeyEvents !== null ) scope._domElementKeyEvents.removeEventListener( 'keydown', onKeyDown );
			};

			const scope = this;
			const STATE = { NONE: - 1, ROTATE: 0, DOLLY: 1, PAN: 2, TOUCH_ROTATE: 3, TOUCH_PAN: 4, TOUCH_DOLLY_PAN: 5, TOUCH_DOLLY_ROTATE: 6 };
			let state = STATE.NONE;
			const EPS = 0.000001;
			const spherical = new THREE.Spherical();
			const sphericalDelta = new THREE.Spherical();
			let scale = 1;
			const panOffset = new THREE.Vector3();
			let zoomChanged = false;
			const rotateStart = new THREE.Vector2();
			const rotateEnd = new THREE.Vector2();
			const rotateDelta = new THREE.Vector2();
			const panStart = new THREE.Vector2();
			const panEnd = new THREE.Vector2();
			const panDelta = new THREE.Vector2();
			const dollyStart = new THREE.Vector2();
			const dollyEnd = new THREE.Vector2();
			const dollyDelta = new THREE.Vector2();

			function getAutoRotationAngle() { return 2 * Math.PI / 60 / 60 * scope.autoRotateSpeed; }
			function getZoomScale() { return Math.pow( 0.95, scope.zoomSpeed ); }
			function rotateLeft( angle ) { sphericalDelta.theta -= angle; }
			function rotateUp( angle ) { sphericalDelta.phi -= angle; }

			const panLeft = function () {
				const v = new THREE.Vector3();
				return function panLeft( distance, objectMatrix ) {
					v.setFromMatrixColumn( objectMatrix, 0 );
					v.multiplyScalar( - distance );
					panOffset.add( v );
				};
			}();

			const panUp = function () {
				const v = new THREE.Vector3();

					v.multiplyScalar( distance );

			}();

			const pan = function () {

				return function pan( deltaX, deltaY ) {
					const element = scope.domElement;
					if ( scope.object.isPerspectiveCamera ) {

					zoomChanged = true;
				}
			}

			function dollyIn( dollyScale ) {
				if ( scope.object.isPerspectiveCamera ) {
					scale *= dollyScale;
				} else if ( scope.object.isOrthographicCamera ) {
					scope.object.zoom = Math.max( scope.minZoom, Math.min( scope.maxZoom, scope.object.zoom / dollyScale ) );
					scope.object.updateProjectionMatrix();
					zoomChanged = true;
				}

			function handleMouseMoveRotate( event ) {

				rotateUp( 2 * Math.PI * rotateDelta.y / element.clientHeight );

				scope.update();
			}

			function handleMouseMoveDolly( event ) {
				dollyEnd.set( event.clientX, event.clientY );
				dollyDelta.subVectors( dollyEnd, dollyStart );

				else if ( dollyDelta.y < 0 ) dollyIn( getZoomScale() );

				scope.update();
			}

			function handleMouseMovePan( event ) {
				panEnd.set( event.clientX, event.clientY );
				panDelta.subVectors( panEnd, panStart ).multiplyScalar( scope.panSpeed );
				pan( panDelta.x, panDelta.y );
				panStart.copy( panEnd );
				scope.update();
			}

			function handleMouseUp( ) { }

			function handleMouseWheel( event ) {
				if ( event.deltaY < 0 ) dollyIn( getZoomScale() );
				else if ( event.deltaY > 0 ) dollyOut( getZoomScale() );
				scope.update();
			}

			function handleKeyDown( event ) {
				let needsUpdate = false;
				switch ( event.code ) {
					case scope.keys.UP: pan( 0, scope.keyPanSpeed ); needsUpdate = true; break;
					case scope.keys.BOTTOM: pan( 0, - scope.keyPanSpeed ); needsUpdate = true; break;
					case scope.keys.LEFT: pan( scope.keyPanSpeed, 0 ); needsUpdate = true; break;
					case scope.keys.RIGHT: pan( - scope.keyPanSpeed, 0 ); needsUpdate = true; break;

				if ( needsUpdate ) { event.preventDefault(); scope.update(); }

					const y = 0.5 * ( event.touches[ 0 ].pageY + event.touches[ 1 ].pageY );
					rotateStart.set( x, y );
				}
			}

			function handleTouchStartPan( event ) {

					const y = 0.5 * ( event.touches[ 0 ].pageY + event.touches[ 1 ].pageY );
					panStart.set( x, y );

			}

			function handleTouchStartDollyPan( event ) {

				if ( scope.enableZoom ) handleTouchStartDolly( event );

			}

			function handleTouchMoveRotate( event ) {
				if ( event.touches.length == 1 ) rotateEnd.set( event.touches[ 0 ].pageX, event.touches[ 0 ].pageY );

					const y = 0.5 * ( event.touches[ 0 ].pageY + event.touches[ 1 ].pageY );
					rotateEnd.set( x, y );

				rotateDelta.subVectors( rotateEnd, rotateStart ).multiplyScalar( scope.rotateSpeed );
				const element = scope.domElement;
				rotateLeft( 2 * Math.PI * rotateDelta.x / element.clientHeight );
				rotateUp( 2 * Math.PI * rotateDelta.y / element.clientHeight );
				rotateStart.copy( rotateEnd );

    <script>
        class TyphoonVisualization {
            constructor() {
                this.container = document.getElementById('canvas-container');
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.controls = null;
                this.raycaster = new THREE.Raycaster();
                this.mouse = new THREE.Vector2();

                this.typhoonParticles = null;
                this.windParticles = null;
                this.typhoonPath = null;
                this.pathNodes = [];
                this.warningRing = null;
                this.eyeMesh = null;

                this.particleCount = 35000;
                this.windParticleCount = 500;
                this.animationSpeed = 0.001;
                this.windIntensity = 3;

                // 台风数据
                this.typhoonData = this.generateTyphoonData();
                this.currentDataIndex = this.typhoonData.length - 1;
                this.hoveredNode = null;
                this.isWarning = false;

                // 预警阈值
                this.warningWindSpeed = 50;
                this.warningPressure = 950;

                this.initialize();
                this.initUI();
                this.animate();
            }

            // 生成模拟台风数据
            generateTyphoonData() {
                const data = [];
                const baseTime = new Date('2024-09-01T00:00:00');

                for (let i = 0; i < 24; i++) {
                    const time = new Date(baseTime.getTime() + i * 6 * 60 * 60 * 1000);
                    const progress = i / 23;

                    let windSpeed, pressure;
                    if (progress < 0.4) {
                        windSpeed = 30 + progress * 2.5 * 40;
                        pressure = 1000 - progress * 2.5 * 80;
                    } else if (progress < 0.7) {
                        windSpeed = 70 + Math.sin((progress - 0.4) * 10) * 10;
                        pressure = 920 + Math.sin((progress - 0.4) * 10) * 20;
                    } else {
                        windSpeed = 70 - (progress - 0.7) * 3.3 * 40;
                        pressure = 920 + (progress - 0.7) * 3.3 * 80;
                    }

                    data.push({
                        id: i,
                        time: time.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit' }),
                        fullTime: time.toLocaleString('zh-CN'),
                        longitude: 120 + i * 0.5 + Math.sin(i * 0.3) * 2,
                        latitude: 18 + i * 0.3 + Math.cos(i * 0.2) * 1.5,
                        windSpeed: Math.round(windSpeed),
                        pressure: Math.round(pressure),
                        moveSpeed: Math.round(15 + Math.random() * 10),
                        moveDirection: ['西北', '北', '东北', '西'][Math.floor(Math.random() * 4)],
                        windRadius7: Math.round(200 + Math.random() * 100),
                        windRadius10: Math.round(80 + Math.random() * 60)
                    });
                }

                return data;
            }

            initialize() {
                this.setupScene();
                this.setupLights();
                this.createOcean();
                this.createSky();
                this.createTyphoon();
                this.createWindField();
                this.createTyphoonPath();
                this.createWarningRing();
                this.setupEventListeners();
                this.checkWarning();
            }

            setupScene() {
                this.scene = new THREE.Scene();
                this.scene.fog = new THREE.Fog(0x0a0f1f, 100, 1000);

                this.camera = new THREE.PerspectiveCamera(75, this.container.clientWidth / this.container.clientHeight, 0.1, 2000);
                this.camera.position.set(30, 20, 30);

                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
                this.renderer.setPixelRatio(window.devicePixelRatio);
                this.container.appendChild(this.renderer.domElement);

                this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;
                this.controls.dampingFactor = 0.05;
            }

            setupLights() {
                const ambientLight = new THREE.AmbientLight(0x404060, 0.6);
                this.scene.add(ambientLight);

                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                directionalLight.position.set(50, 100, 50);
                this.scene.add(directionalLight);

                const eyeLight = new THREE.PointLight(0x4a90e2, 1.5, 100);
                eyeLight.position.set(0, 10, 0);
                this.scene.add(eyeLight);
            }

            createOcean() {
                const geometry = new THREE.PlaneGeometry(200, 200);
                const material = new THREE.MeshStandardMaterial({
                    color: 0x1e4072,
                    roughness: 0.1,
                    metalness: 0.3
                });
                const ocean = new THREE.Mesh(geometry, material);
                ocean.rotation.x = -Math.PI / 2;
                ocean.position.y = -5;
                this.scene.add(ocean);
            }

            createSky() {
                const starGeometry = new THREE.BufferGeometry();
                const starCount = 500;
                const starPositions = new Float32Array(starCount * 3);

                for (let i = 0; i < starCount * 3; i += 3) {
                    starPositions[i] = (Math.random() - 0.5) * 400;
                    starPositions[i + 1] = Math.random() * 200 + 20;
                    starPositions[i + 2] = (Math.random() - 0.5) * 400;
                }

                starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));

                const starMaterial = new THREE.PointsMaterial({
                    color: 0xffffff,
                    size: 0.5
                });

                const stars = new THREE.Points(starGeometry, starMaterial);
                this.scene.add(stars);
            }

            createTyphoon() {
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(this.particleCount * 3);
                const colors = new Float32Array(this.particleCount * 3);
                const sizes = new Float32Array(this.particleCount);

                const arms = 4;
                const eyeRadius = 3;

                for (let i = 0; i < this.particleCount; i++) {
                    const arm = Math.floor(i / (this.particleCount / arms));
                    const angle = (i / this.particleCount) * Math.PI * 2 * arms + arm * (Math.PI * 2 / arms);
                    const radius = Math.exp((angle * 0.3)) * 2;
                    const height = Math.random() * 15 + 2;

                    const x = Math.cos(angle) * radius;
                    const y = height;
                    const z = Math.sin(angle) * radius;

                    if (radius < eyeRadius) continue;

                    positions[i * 3] = x;
                    positions[i * 3 + 1] = y;
                    positions[i * 3 + 2] = z;

                    const distance = Math.sqrt(x * x + z * z);
                    const density = 1 - distance / 50;
                    const gray = Math.random() * 0.3 + 0.7;

                    colors[i * 3] = gray;
                    colors[i * 3 + 1] = gray;
                    colors[i * 3 + 2] = gray;

                    sizes[i] = (Math.random() * 0.3 + 0.1) * (1 + density);
                }

                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

                const material = new THREE.ShaderMaterial({
                    uniforms: { time: { value: 0.0 } },
                    vertexShader: `
                        attribute float size;
                        uniform float time;
                        varying vec3 vColor;
                        void main() {
                            vColor = color;
                            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                            gl_PointSize = size * (300.0 / -mvPosition.z);
                            gl_Position = projectionMatrix * mvPosition;
                        }
                    `,
                    fragmentShader: `
                        varying vec3 vColor;
                        void main() {
                            float distanceToCenter = distance(gl_PointCoord, vec2(0.5));
                            float strength = 1.0 - smoothstep(0.0, 0.5, distanceToCenter);
                            gl_FragColor = vec4(vColor, strength);
                        }
                    `,
                    blending: THREE.AdditiveBlending,
                    vertexColors: true,
                    transparent: true
                });

                this.typhoonParticles = new THREE.Points(geometry, material);
                this.scene.add(this.typhoonParticles);

                // 创建台风眼
                this.createEye();
            }

            createEye() {
                const geometry = new THREE.CylinderGeometry(3, 3, 20, 32, 1, true);
                const material = new THREE.ShaderMaterial({
                    uniforms: {
                        time: { value: 0 },
                        color: { value: new THREE.Color(0xffe66d) }
                    },
                    vertexShader: `
                        uniform float time;
                        varying vec2 vUv;
                        varying float vHeight;
                        void main() {
                            vUv = uv;
                            vHeight = position.y;
                            vec3 pos = position;
                            float wave = sin(time * 3.0 + position.y * 0.5) * 0.3;
                            pos.x += wave;
                            pos.z += wave;
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                        }
                    `,
                    fragmentShader: `
                        uniform vec3 color;
                        uniform float time;
                        varying vec2 vUv;
                        varying float vHeight;
                        void main() {
                            float gradient = smoothstep(-10.0, 10.0, vHeight);
                            float edge = abs(vUv.x - 0.5) * 2.0;
                            float alpha = smoothstep(0.0, 0.3, edge) * (1.0 - smoothstep(0.7, 1.0, edge));
                            float pulse = 0.8 + sin(time * 2.0) * 0.2;
                            vec3 finalColor = mix(color * 0.5, color * pulse, gradient);
                            gl_FragColor = vec4(finalColor, alpha * 0.6);
                        }
                    `,
                    transparent: true,
                    side: THREE.DoubleSide,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });

                this.eyeMesh = new THREE.Mesh(geometry, material);
                this.scene.add(this.eyeMesh);
            }

            createWindField() {
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(this.windParticleCount * 3);
                const colors = new Float32Array(this.windParticleCount * 3);

                for (let i = 0; i < this.windParticleCount; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const radius = Math.random() * 40 + 5;
                    const height = Math.random() * 10 + 2;

                    const x = Math.cos(angle) * radius;
                    const y = height;
                    const z = Math.sin(angle) * radius;

                    positions[i * 3] = x;
                    positions[i * 3 + 1] = y;
                    positions[i * 3 + 2] = z;

                    colors[i * 3] = 0.8;
                    colors[i * 3 + 1] = 0.9;
                    colors[i * 3 + 2] = 1.0;
                }

                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

                const material = new THREE.PointsMaterial({
                    size: 0.2,
                    vertexColors: true,
                    transparent: true,
                    blending: THREE.AdditiveBlending
                });

                this.windParticles = new THREE.Points(geometry, material);
                this.scene.add(this.windParticles);
            }

            createTyphoonPath() {
                // 使用生成的数据创建路径
                const pathPoints = this.typhoonData.map(d => {
                    return new THREE.Vector3(
                        (d.longitude - 125) * 5,
                        0.5,
                        -(d.latitude - 22) * 5
                    );
                });

                const geometry = new THREE.BufferGeometry().setFromPoints(pathPoints);
                const material = new THREE.LineBasicMaterial({
                    color: 0xff6b35,
                    transparent: true,
                    opacity: 0.8,
                    linewidth: 3
                });

                this.typhoonPath = new THREE.Line(geometry, material);
                this.scene.add(this.typhoonPath);

                // 创建可交互的路径节点
                const nodeGeometry = new THREE.SphereGeometry(0.8, 16, 16);
                const nodeMaterial = new THREE.MeshBasicMaterial({
                    color: 0xff6b35,
                    transparent: true,
                    opacity: 0.9
                });

                this.typhoonData.forEach((data, index) => {
                    const node = new THREE.Mesh(nodeGeometry, nodeMaterial.clone());
                    node.position.set(
                        (data.longitude - 125) * 5,
                        0.5,
                        -(data.latitude - 22) * 5
                    );
                    node.userData = { index, data };
                    this.pathNodes.push(node);
                    this.scene.add(node);
                });
            }

            createWarningRing() {
                // 预警光圈 - Shader绘制脉冲圆环
                // 调整半径使其围绕台风外围（台风粒子半径约40-50）
                const geometry = new THREE.RingGeometry(35, 38, 64);
                const material = new THREE.ShaderMaterial({
                    uniforms: {
                        time: { value: 0 },
                        color: { value: new THREE.Color(0xe94560) },
                        active: { value: 0.0 }
                    },
                    vertexShader: `
                        varying vec2 vUv;
                        void main() {
                            vUv = uv;
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                        }
                    `,
                    fragmentShader: `
                        uniform float time;
                        uniform vec3 color;
                        uniform float active;
                        varying vec2 vUv;
                        void main() {
                            if (active < 0.5) discard;
                            float pulse = sin(time * 4.0) * 0.5 + 0.5;
                            float dist = distance(vUv, vec2(0.5));
                            // 创建脉冲效果，从中心向外扩散
                            float ringWidth = 0.1;
                            float ringPos = 0.5 + sin(time * 2.0) * 0.1;
                            float alpha = smoothstep(0.0, ringWidth, 1.0 - abs(dist - ringPos));
                            alpha *= pulse;
                            gl_FragColor = vec4(color, alpha * 0.9);
                        }
                    `,
                    transparent: true,
                    side: THREE.DoubleSide,
                    depthWrite: false,
                    blending: THREE.AdditiveBlending
                });

                this.warningRing = new THREE.Mesh(geometry, material);
                this.warningRing.rotation.x = -Math.PI / 2;
                this.warningRing.position.y = 2; // 提高位置使其可见
                this.warningRing.visible = false;
                this.scene.add(this.warningRing);

                // 添加第二个内圈光环增强效果
                const innerGeometry = new THREE.RingGeometry(25, 27, 64);
                const innerMaterial = new THREE.ShaderMaterial({
                    uniforms: {
                        time: { value: 0 },
                        color: { value: new THREE.Color(0xff3333) },
                        active: { value: 0.0 }
                    },
                    vertexShader: `
                        varying vec2 vUv;
                        void main() {
                            vUv = uv;
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                        }
                    `,
                    fragmentShader: `
                        uniform float time;
                        uniform vec3 color;
                        uniform float active;
                        varying vec2 vUv;
                        void main() {
                            if (active < 0.5) discard;
                            float pulse = sin(time * 6.0 + 1.0) * 0.5 + 0.5;
                            float dist = distance(vUv, vec2(0.5));
                            float alpha = smoothstep(0.0, 0.15, 1.0 - abs(dist - 0.5));
                            alpha *= pulse * 0.7;
                            gl_FragColor = vec4(color, alpha);
                        }
                    `,
                    transparent: true,
                    side: THREE.DoubleSide,
                    depthWrite: false,
                    blending: THREE.AdditiveBlending
                });

                this.innerWarningRing = new THREE.Mesh(innerGeometry, innerMaterial);
                this.innerWarningRing.rotation.x = -Math.PI / 2;
                this.innerWarningRing.position.y = 3;
                this.innerWarningRing.visible = false;
                this.scene.add(this.innerWarningRing);
            }

            checkWarning() {
                const currentData = this.typhoonData[this.currentDataIndex];
                const shouldWarn = currentData.windSpeed >= this.warningWindSpeed ||
                                  currentData.pressure <= this.warningPressure;

                if (shouldWarn && !this.isWarning) {
                    this.isWarning = true;
                    this.showWarning();
                } else if (!shouldWarn && this.isWarning) {
                    this.isWarning = false;
                    this.hideWarning();
                }
            }

            showWarning() {
                if (this.warningRing) {
                    this.warningRing.visible = true;
                    this.warningRing.material.uniforms.active.value = 1.0;
                }
                if (this.innerWarningRing) {
                    this.innerWarningRing.visible = true;
                    this.innerWarningRing.material.uniforms.active.value = 1.0;
                }
                document.getElementById('warningIndicator').classList.add('show');
                document.getElementById('typhoonLevel').classList.add('warning');
            }

            hideWarning() {
                if (this.warningRing) {
                    this.warningRing.visible = false;
                    this.warningRing.material.uniforms.active.value = 0.0;
                }
                if (this.innerWarningRing) {
                    this.innerWarningRing.visible = false;
                    this.innerWarningRing.material.uniforms.active.value = 0.0;
                }
                document.getElementById('warningIndicator').classList.remove('show');
                document.getElementById('typhoonLevel').classList.remove('warning');
            }

            initUI() {
                // 生成路径列表
                const pathList = document.getElementById('pathList');
                this.typhoonData.forEach((data, index) => {
                    const item = document.createElement('div');
                    item.className = 'path-item';
                    item.innerHTML = `
                        <div class="time">${data.time}</div>
                        <div class="coords">${data.longitude.toFixed(1)}°E, ${data.latitude.toFixed(1)}°N</div>
                        <div class="wind">${data.windSpeed}m/s</div>
                    `;
                    item.addEventListener('mouseenter', () => {
                        this.onNodeHover(index);
                    });
                    item.addEventListener('mouseleave', () => {
                        this.onNodeLeave();
                    });
                    pathList.appendChild(item);
                });

                // 初始化数据面板
                this.updateDataPanel(this.currentDataIndex);
            }

            updateDataPanel(index) {
                const data = this.typhoonData[index];

                document.getElementById('windSpeed').textContent = data.windSpeed + ' m/s';
                document.getElementById('pressure').textContent = data.pressure + ' hPa';
                document.getElementById('moveSpeed').textContent = data.moveSpeed + ' km/h';
                document.getElementById('moveDirection').textContent = data.moveDirection;
                document.getElementById('windRadius7').textContent = data.windRadius7 + ' km';
                document.getElementById('windRadius10').textContent = data.windRadius10 + ' km';
                document.getElementById('longitude').textContent = data.longitude.toFixed(1) + '°E';
                document.getElementById('latitude').textContent = data.latitude.toFixed(1) + '°N';

                const level = this.getTyphoonLevel(data.windSpeed);
                document.getElementById('typhoonLevel').textContent = level;

                // 检查预警样式
                const windSpeedItem = document.getElementById('windSpeedItem');
                const pressureItem = document.getElementById('pressureItem');
                const windSpeedValue = document.getElementById('windSpeed');
                const pressureValue = document.getElementById('pressure');

                if (data.windSpeed >= this.warningWindSpeed) {
                    windSpeedItem.classList.add('highlight');
                    windSpeedValue.classList.add('warning');
                } else {
                    windSpeedItem.classList.remove('highlight');
                    windSpeedValue.classList.remove('warning');
                }

                if (data.pressure <= this.warningPressure) {
                    pressureItem.classList.add('highlight');
                    pressureValue.classList.add('warning');
                } else {
                    pressureItem.classList.remove('highlight');
                    pressureValue.classList.remove('warning');
                }
            }

            getTyphoonLevel(windSpeed) {
                if (windSpeed >= 51) return '超强台风';
                if (windSpeed >= 41) return '强台风';
                if (windSpeed >= 32.7) return '台风';
                if (windSpeed >= 24.5) return '强热带风暴';
                if (windSpeed >= 17.2) return '热带风暴';
                return '热带低压';
            }

            onNodeHover(index) {
                // 高亮节点
                this.pathNodes.forEach((node, i) => {
                    if (i === index) {
                        node.material.color.setHex(0xe94560);
                        node.scale.set(1.5, 1.5, 1.5);
                    } else {
                        node.material.color.setHex(0xff6b35);
                        node.scale.set(1, 1, 1);
                    }
                });

                // 更新数据面板
                this.updateDataPanel(index);

                // 高亮路径列表项
                this.highlightPathItem(index);
            }

            onNodeLeave() {
                // 恢复节点状态
                this.pathNodes.forEach(node => {
                    node.material.color.setHex(0xff6b35);
                    node.scale.set(1, 1, 1);
                });

                // 恢复当前数据
                this.updateDataPanel(this.currentDataIndex);

                // 移除列表高亮
                this.removePathItemHighlight();
            }

            highlightPathItem(index) {
                const items = document.querySelectorAll('.path-item');
                items.forEach((item, i) => {
                    if (i === index) {
                        item.classList.add('active');
                        item.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    } else {
                        item.classList.remove('active');
                    }
                });
            }

            removePathItemHighlight() {
                const items = document.querySelectorAll('.path-item');
                items.forEach(item => item.classList.remove('active'));
            }

            update() {
                const time = Date.now() * this.animationSpeed;

                if (this.typhoonParticles) {
                    this.typhoonParticles.rotation.y += this.animationSpeed * 0.5;
                }

                if (this.eyeMesh) {
                    this.eyeMesh.material.uniforms.time.value = time / 1000;
                    this.eyeMesh.rotation.y -= 0.02;
                }

                if (this.warningRing && this.isWarning) {
                    this.warningRing.material.uniforms.time.value = time / 1000;
                }
                if (this.innerWarningRing && this.isWarning) {
                    this.innerWarningRing.material.uniforms.time.value = time / 1000;
                }

                const typhoonPositions = this.typhoonParticles.geometry.attributes.position;
                for (let i = 0; i < typhoonPositions.count; i++) {
                    const x = typhoonPositions.getX(i);
                    const z = typhoonPositions.getZ(i);
                    const distance = Math.sqrt(x * x + z * z);
                    const angle = Math.atan2(z, x);
                    typhoonPositions.setXYZ(
                        i,
                        x + Math.cos(angle + time) * 0.01 * this.windIntensity,
                        typhoonPositions.getY(i),
                        z + Math.sin(angle + time) * 0.01 * this.windIntensity
                    );
                }
                typhoonPositions.needsUpdate = true;

                const windPositions = this.windParticles.geometry.attributes.position;
                for (let i = 0; i < windPositions.count; i++) {
                    const x = windPositions.getX(i);
                    const z = windPositions.getZ(i);
                    const distance = Math.sqrt(x * x + z * z);
                    const angle = Math.atan2(z, x);
                    windPositions.setXYZ(
                        i,
                        x + Math.cos(angle + time * 2) * 0.02 * this.windIntensity,
                        windPositions.getY(i),
                        z + Math.sin(angle + time * 2) * 0.02 * this.windIntensity
                    );
                }
                windPositions.needsUpdate = true;
            }

            animate() {
                requestAnimationFrame(() => this.animate());
                this.update();
                this.controls.update();
                this.renderer.render(this.scene, this.camera);
            }

            setupEventListeners() {
                // 窗口大小调整
                window.addEventListener('resize', () => {
                    this.camera.aspect = this.container.clientWidth / this.container.clientHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
                });

                // 键盘控制风力强度
                window.addEventListener('keydown', (event) => {
                    const key = parseInt(event.key);
                    if (key >= 1 && key <= 5) {
                        this.windIntensity = key;
                    }
                });

                // 鼠标移动事件（用于picking）
                this.container.addEventListener('mousemove', (e) => this.onMouseMove(e));
            }

            onMouseMove(event) {
                const rect = this.container.getBoundingClientRect();
                this.mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                this.mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

                // 射线检测
                this.raycaster.setFromCamera(this.mouse, this.camera);
                const intersects = this.raycaster.intersectObjects(this.pathNodes);

                if (intersects.length > 0) {
                    const node = intersects[0].object;
                    if (this.hoveredNode !== node) {
                        this.hoveredNode = node;
                        this.onNodeHover(node.userData.index);
                    }
                } else {
                    if (this.hoveredNode) {
                        this.hoveredNode = null;
                        this.onNodeLeave();
                    }
                }
            }
        }

        new TyphoonVisualization();
    </script>
</body>
</html>
