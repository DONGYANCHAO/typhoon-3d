<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>3D 台风路径模拟器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            overflow: hidden;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        .scene-container {
            flex: 1;
            position: relative;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
        }

        .data-panel {
            width: 380px;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.95) 0%, rgba(30, 41, 59, 0.98) 100%);
            border-left: 2px solid rgba(74, 144, 226, 0.3);
            padding: 20px;
            overflow-y: auto;
            color: #e2e8f0;
        }

        .panel-header {
            text-align: center;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(74, 144, 226, 0.3);
            margin-bottom: 20px;
        }

        .panel-header h1 {
            font-size: 22px;
            color: #4a90e2;
            margin-bottom: 5px;
        }

        .panel-header .subtitle {
            font-size: 12px;
            color: #94a3b8;
        }

        .typhoon-info {
            background: rgba(30, 58, 95, 0.4);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .typhoon-name {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .typhoon-name h2 {
            font-size: 20px;
            color: #f59e0b;
        }

        .level-badge {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .level-normal {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }

        .level-warning {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
        }

        .level-danger {
            background: linear-gradient(135deg, #ff2200, #cc0000);
            color: white;
            animation: danger-pulse 0.4s ease-in-out infinite;
            display: inline-block;
            will-change: box-shadow;
        }

        @keyframes danger-pulse {
            0%, 100% {
                border: 3px solid #ff0000;
                box-shadow: 0 0 10px #ff0000, 0 0 20px rgba(255, 0, 0, 0.8), 0 0 30px rgba(255, 51, 0, 0.6), inset 0 0 10px rgba(255, 255, 0, 0.3);
            }
            25% {
                border: 3px solid #ff4400;
                box-shadow: 0 0 15px #ff4400, 0 0 25px rgba(255, 34, 0, 0.9), 0 0 40px rgba(255, 0, 0, 0.7), inset 0 0 15px rgba(255, 255, 0, 0.5);
            }
            50% {
                border: 4px solid #ffff00;
                box-shadow: 0 0 20px #ffff00, 0 0 35px rgba(255, 102, 0, 1), 0 0 60px rgba(255, 0, 0, 0.9), inset 0 0 20px rgba(255, 255, 255, 0.6);
            }
            75% {
                border: 3px solid #ff4400;
                box-shadow: 0 0 15px #ff4400, 0 0 25px rgba(255, 34, 0, 0.9), 0 0 40px rgba(255, 0, 0, 0.7), inset 0 0 15px rgba(255, 255, 0, 0.5);
            }
        }

        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .data-item {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }

        .data-label {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 5px;
        }

        .data-value {
            font-size: 18px;
            font-weight: bold;
            color: #4a90e2;
        }

        .data-value.danger {
            color: #ef4444;
            animation: text-pulse 0.8s ease-in-out infinite;
        }

        @keyframes text-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .path-history {
            margin-top: 20px;
        }

        .path-history h3 {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .path-history h3::before {
            content: '';
            width: 4px;
            height: 16px;
            background: linear-gradient(180deg, #ff6600, #ffaa00);
            border-radius: 2px;
        }

        .history-list {
            max-height: 350px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .history-item {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .history-item:hover {
            background: rgba(74, 144, 226, 0.2);
            transform: translateX(3px);
        }

        .history-item.highlighted {
            background: rgba(255, 106, 0, 0.3);
            border-color: #ff6600;
            box-shadow: 0 0 15px rgba(255, 102, 0, 0.5);
            transform: scale(1.02);
        }

        .history-time {
            font-size: 12px;
            color: #ffaa00;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .history-details {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
        }

        .history-details span {
            color: #94a3b8;
        }

        .history-details strong {
            color: #e2e8f0;
        }

        .instructions {
            margin-top: 20px;
            padding: 12px;
            background: rgba(74, 144, 226, 0.1);
            border-radius: 8px;
            border-left: 3px solid #4a90e2;
        }

        .instructions p {
            font-size: 11px;
            color: #94a3b8;
            line-height: 1.6;
        }

        .instructions strong {
            color: #4a90e2;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }

        ::-webkit-scrollbar-thumb {
            background: #4a90e2;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="scene-container" id="canvas-container"></div>
        
        <div class="data-panel">
            <div class="panel-header">
                <h1>🌀 台风路径模拟器</h1>
                <div class="subtitle">Interactive 3D Typhoon Visualization</div>
            </div>

            <div class="typhoon-info">
                <div class="typhoon-name">
                    <h2>台风 MAWAR</h2>
                    <span class="level-badge level-normal" id="level-badge">强台风</span>
                </div>
                
                <div class="data-grid">
                    <div class="data-item">
                        <div class="data-label">中心风速</div>
                        <div class="data-value" id="wind-speed">42 m/s</div>
                    </div>
                    <div class="data-item">
                        <div class="data-label">中心气压</div>
                        <div class="data-value" id="pressure">955 hPa</div>
                    </div>
                    <div class="data-item">
                        <div class="data-label">移动速度</div>
                        <div class="data-value">15 km/h</div>
                    </div>
                    <div class="data-item">
                        <div class="data-label">7级风圈半径</div>
                        <div class="data-value">350 km</div>
                    </div>
                </div>
            </div>

            <div class="path-history">
                <h3>历史路径数据</h3>
                <div class="history-list" id="history-list">
                </div>
            </div>

            <div class="instructions">
                <p>
                    <strong>操作说明：</strong><br>
                    • 鼠标左键拖动：旋转视角<br>
                    • 鼠标滚轮：缩放场景<br>
                    • 鼠标右键拖动：平移场景<br>
                    • 悬停路径节点：高亮对应数据
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
    ( function () {

		type: 'change'

			this.panSpeed = 1.0;

    <script>
        const typhoonHistoryData = [
            { time: '05-20 08:00', windSpeed: 55, pressure: 930, level: '超强台风' },
            { time: '05-20 02:00', windSpeed: 52, pressure: 935, level: '超强台风' },
            { time: '05-19 20:00', windSpeed: 48, pressure: 940, level: '强台风' },
            { time: '05-19 14:00', windSpeed: 45, pressure: 945, level: '强台风' },
            { time: '05-19 08:00', windSpeed: 42, pressure: 950, level: '台风' },
            { time: '05-19 02:00', windSpeed: 40, pressure: 955, level: '台风' },
            { time: '05-18 20:00', windSpeed: 38, pressure: 960, level: '强热带风暴' },
            { time: '05-18 14:00', windSpeed: 35, pressure: 965, level: '强热带风暴' },
            { time: '05-18 08:00', windSpeed: 32, pressure: 970, level: '热带风暴' },
            { time: '05-18 02:00', windSpeed: 28, pressure: 980, level: '热带风暴' }
        ];

        class TyphoonVisualization {
            constructor() {
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.controls = null;
                this.raycaster = null;
                this.mouse = null;

                this.typhoonParticles = null;
                this.windParticles = null;
                this.typhoonPath = null;
                this.pathMarkers = [];
                this.warningRing = null;
                this.windIntensity = 3;

                this.particleCount = 35000;
                this.windParticleCount = 500;
                this.animationSpeed = 0.001;

                this.WIND_SPEED_THRESHOLD = 50;
                this.PRESSURE_THRESHOLD = 940;
                this.isWarningActive = false;
                this.currentDataIndex = 0;

                this.initialize();
                this.animate();
            }

            initialize() {
                this.setupScene();
                this.setupLights();
                this.createOcean();
                this.createSky();
                this.createTyphoon();
                this.createWindField();
                this.createTyphoonPath();
                this.createWarningRing();
                this.setupRaycaster();
                this.populateHistoryPanel();
                this.setupEventListeners();
                this.checkWarningStatus();
            }

            setupScene() {
                const container = document.getElementById('canvas-container');
                const width = container.clientWidth;
                const height = container.clientHeight;

                this.scene = new THREE.Scene();
                this.scene.fog = new THREE.Fog(0x0a0f1f, 100, 1000);

                this.camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 2000);
                this.camera.position.set(30, 20, 30);

                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                this.renderer.setSize(width, height);
                this.renderer.setPixelRatio(window.devicePixelRatio);
                container.appendChild(this.renderer.domElement);

                this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;
                this.controls.dampingFactor = 0.05;
            }

            setupLights() {
                const ambientLight = new THREE.AmbientLight(0x404060, 0.6);
                this.scene.add(ambientLight);

                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                directionalLight.position.set(50, 100, 50);
                this.scene.add(directionalLight);

                const eyeLight = new THREE.PointLight(0x4a90e2, 1.5, 100);
                eyeLight.position.set(0, 10, 0);
                this.scene.add(eyeLight);
            }

            createOcean() {
                const geometry = new THREE.PlaneGeometry(200, 200);
                const material = new THREE.MeshStandardMaterial({
                    color: 0x1e4072,
                    roughness: 0.1,
                    metalness: 0.3
                });
                const ocean = new THREE.Mesh(geometry, material);
                ocean.rotation.x = -Math.PI / 2;
                ocean.position.y = -5;
                this.scene.add(ocean);
            }

            createSky() {
                const starGeometry = new THREE.BufferGeometry();
                const starCount = 500;
                const starPositions = new Float32Array(starCount * 3);

                for (let i = 0; i < starCount * 3; i += 3) {
                    starPositions[i] = (Math.random() - 0.5) * 400;
                    starPositions[i + 1] = Math.random() * 200 + 20;
                    starPositions[i + 2] = (Math.random() - 0.5) * 400;
                }

                starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));

                const starMaterial = new THREE.PointsMaterial({
                    color: 0xffffff,
                    size: 0.5
                });

                const stars = new THREE.Points(starGeometry, starMaterial);
                this.scene.add(stars);
            }

            createTyphoon() {
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(this.particleCount * 3);
                const colors = new Float32Array(this.particleCount * 3);
                const sizes = new Float32Array(this.particleCount);

                const arms = 4;
                const eyeRadius = 3;

                for (let i = 0; i < this.particleCount; i++) {
                    const arm = Math.floor(i / (this.particleCount / arms));
                    const angle = (i / this.particleCount) * Math.PI * 2 * arms + arm * (Math.PI * 2 / arms);
                    const radius = Math.exp((angle * 0.3)) * 2;
                    const height = Math.random() * 15 + 2;

                    const x = Math.cos(angle) * radius;
                    const y = height;
                    const z = Math.sin(angle) * radius;

                    if (radius < eyeRadius) continue;

                    positions[i * 3] = x;
                    positions[i * 3 + 1] = y;
                    positions[i * 3 + 2] = z;

                    const distance = Math.sqrt(x * x + z * z);
                    const density = 1 - distance / 50;
                    const gray = Math.random() * 0.3 + 0.7;

                    colors[i * 3] = gray;
                    colors[i * 3 + 1] = gray;
                    colors[i * 3 + 2] = gray;

                    sizes[i] = (Math.random() * 0.3 + 0.1) * (1 + density);
                }

                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

                const material = new THREE.ShaderMaterial({
                    uniforms: {
                        time: { value: 0.0 }
                    },
                    vertexShader: `
                        attribute float size;
                        uniform float time;
                        varying vec3 vColor;

                        void main() {
                            vColor = color;
                            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                            gl_PointSize = size * (300.0 / -mvPosition.z);
                            gl_Position = projectionMatrix * mvPosition;
                        }
                    `,
                    fragmentShader: `
                        varying vec3 vColor;

                        void main() {
                            float distanceToCenter = distance(gl_PointCoord, vec2(0.5));
                            float strength = 1.0 - smoothstep(0.0, 0.5, distanceToCenter);
                            gl_FragColor = vec4(vColor, strength);
                        }
                    `,
                    blending: THREE.AdditiveBlending,
                    vertexColors: true,
                    transparent: true
                });

                this.typhoonParticles = new THREE.Points(geometry, material);
                this.scene.add(this.typhoonParticles);
            }

            createWindField() {
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(this.windParticleCount * 3);
                const colors = new Float32Array(this.windParticleCount * 3);

                for (let i = 0; i < this.windParticleCount; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const radius = Math.random() * 40 + 5;
                    const height = Math.random() * 10 + 2;

                    const x = Math.cos(angle) * radius;
                    const y = height;
                    const z = Math.sin(angle) * radius;

                    positions[i * 3] = x;
                    positions[i * 3 + 1] = y;
                    positions[i * 3 + 2] = z;

                    colors[i * 3] = 0.8;
                    colors[i * 3 + 1] = 0.9;
                    colors[i * 3 + 2] = 1.0;
                }

                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

                const material = new THREE.PointsMaterial({
                    size: 0.2,
                    vertexColors: true,
                    transparent: true,
                    blending: THREE.AdditiveBlending
                });

                this.windParticles = new THREE.Points(geometry, material);
                this.scene.add(this.windParticles);
            }

            createTyphoonPath() {
                const pathPoints = [];
                const markerCount = typhoonHistoryData.length;

                for (let i = 0; i < markerCount; i++) {
                    const angle = (i / markerCount) * Math.PI * 1.2;
                    const radius = 18 * (1 - i / markerCount * 0.5);
                    const x = Math.cos(angle) * radius - i * 0.8;
                    const z = Math.sin(angle) * radius * 0.5 + i * 0.5;
                    
                    pathPoints.push(new THREE.Vector3(x, 0, z));
                }

                const geometry = new THREE.BufferGeometry().setFromPoints(pathPoints);
                const material = new THREE.LineBasicMaterial({
                    color: 0xffaa00,
                    transparent: true,
                    opacity: 0.8
                });

                this.typhoonPath = new THREE.Line(geometry, material);
                this.scene.add(this.typhoonPath);

                for (let i = 0; i < pathPoints.length; i++) {
                    const markerGeometry = new THREE.SphereGeometry(0.4, 16, 16);
                    const markerMaterial = new THREE.MeshBasicMaterial({ 
                        color: 0xff6600
                    });
                    const marker = new THREE.Mesh(markerGeometry, markerMaterial);
                    marker.position.copy(pathPoints[i]);
                    marker.userData = { index: i, data: typhoonHistoryData[i] };
                    this.pathMarkers.push(marker);
                    this.scene.add(marker);
                }
            }

            createWarningRing() {
                this.warningRings = [];
                const ringRadii = [22, 30, 38];
                
                ringRadii.forEach((radius, index) => {
                    const geometry = new THREE.TorusGeometry(radius, 1.5, 32, 128);
                    const material = new THREE.ShaderMaterial({
                        uniforms: {
                            time: { value: 0.0 },
                            active: { value: 0.0 },
                            ringIndex: { value: index }
                        },
                        vertexShader: `
                            varying vec3 vNormal;
                            void main() {
                                vNormal = normalize(normalMatrix * normal);
                                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                            }
                        `,
                        fragmentShader: `
                            uniform float time;
                            uniform float active;
                            uniform float ringIndex;
                            varying vec3 vNormal;
                            
                            void main() {
                                if (active < 0.5) discard;
                                
                                float pulsePhase = ringIndex * 1.5;
                                float pulse = 0.4 + 0.6 * sin(time * 4.0 + pulsePhase);
                                
                                float edgeGlow = pow(abs(vNormal.y), 0.3);
                                
                                vec3 ringColor = mix(
                                    vec3(1.0, 0.2, 0.0),
                                    vec3(1.0, 0.9, 0.0),
                                    0.5 + 0.5 * sin(time * 3.0 + ringIndex)
                                );
                                
                                float alpha = edgeGlow * pulse;
                                
                                gl_FragColor = vec4(ringColor * 2.0, alpha * 0.9);
                            }
                        `,
                        transparent: true,
                        blending: THREE.AdditiveBlending,
                        side: THREE.DoubleSide,
                        depthWrite: false
                    });

                    const ring = new THREE.Mesh(geometry, material);
                    ring.rotation.x = Math.PI / 2;
                    ring.position.y = 0.5;
                    this.warningRings.push(ring);
                    this.scene.add(ring);
                });
            }

            setupRaycaster() {
                this.raycaster = new THREE.Raycaster();
                this.mouse = new THREE.Vector2();
            }

            populateHistoryPanel() {
                const historyList = document.getElementById('history-list');
                historyList.innerHTML = '';

                typhoonHistoryData.forEach((data, index) => {
                    const item = document.createElement('div');
                    item.className = 'history-item';
                    item.id = `history-item-${index}`;
                    item.innerHTML = `
                        <div class="history-time">${data.time}</div>
                        <div class="history-details">
                            <span>风速: <strong>${data.windSpeed} m/s</strong></span>
                            <span>气压: <strong>${data.pressure} hPa</strong></span>
                        </div>
                    `;
                    historyList.appendChild(item);
                });
            }

            checkWarningStatus() {
                const currentData = typhoonHistoryData[this.currentDataIndex];
                const shouldWarn = currentData.windSpeed >= this.WIND_SPEED_THRESHOLD || 
                                   currentData.pressure <= this.PRESSURE_THRESHOLD;

                if (shouldWarn !== this.isWarningActive) {
                    this.isWarningActive = shouldWarn;
                    this.updateWarningVisuals();
                }

                document.getElementById('wind-speed').textContent = `${currentData.windSpeed} m/s`;
                document.getElementById('pressure').textContent = `${currentData.pressure} hPa`;

                const windSpeedEl = document.getElementById('wind-speed');
                const pressureEl = document.getElementById('pressure');
                
                if (currentData.windSpeed >= this.WIND_SPEED_THRESHOLD) {
                    windSpeedEl.classList.add('danger');
                } else {
                    windSpeedEl.classList.remove('danger');
                }

                if (currentData.pressure <= this.PRESSURE_THRESHOLD) {
                    pressureEl.classList.add('danger');
                } else {
                    pressureEl.classList.remove('danger');
                }
            }

            updateWarningVisuals() {
                const levelBadge = document.getElementById('level-badge');
                
                if (this.isWarningActive) {
                    this.warningRings.forEach(ring => {
                        ring.material.uniforms.active.value = 1.0;
                    });
                    levelBadge.className = 'level-badge level-danger';
                    levelBadge.textContent = '危险预警';
                } else {
                    this.warningRings.forEach(ring => {
                        ring.material.uniforms.active.value = 0.0;
                    });
                    const currentData = typhoonHistoryData[this.currentDataIndex];
                    if (currentData.windSpeed >= 45) {
                        levelBadge.className = 'level-badge level-warning';
                        levelBadge.textContent = '强台风';
                    } else {
                        levelBadge.className = 'level-badge level-normal';
                        levelBadge.textContent = '台风';
                    }
                }
            }

            highlightMarker(index) {
                this.pathMarkers.forEach((marker, i) => {
                    if (i === index) {
                        marker.material.color.setHex(0x00ff00);
                        marker.scale.set(1.5, 1.5, 1.5);
                    } else {
                        marker.material.color.setHex(0xff6600);
                        marker.scale.set(1, 1, 1);
                    }
                });
            }

            highlightDataItem(index) {
                document.querySelectorAll('.history-item').forEach((item, i) => {
                    if (i === index) {
                        item.classList.add('highlighted');
                    } else {
                        item.classList.remove('highlighted');
                    }
                });
            }

            handleMouseMove(event) {
                const container = document.getElementById('canvas-container');
                const rect = container.getBoundingClientRect();
                
                this.mouse.x = ((event.clientX - rect.left) / container.clientWidth) * 2 - 1;
                this.mouse.y = -((event.clientY - rect.top) / container.clientHeight) * 2 + 1;

                this.raycaster.setFromCamera(this.mouse, this.camera);
                const intersects = this.raycaster.intersectObjects(this.pathMarkers);

                if (intersects.length > 0) {
                    const index = intersects[0].object.userData.index;
                    this.currentDataIndex = index;
                    this.highlightMarker(index);
                    this.highlightDataItem(index);
                    this.checkWarningStatus();
                    document.body.style.cursor = 'pointer';
                } else {
                    document.body.style.cursor = 'auto';
                }
            }

            update() {
                const time = Date.now() * this.animationSpeed;
                this.typhoonParticles.rotation.y += this.animationSpeed * 0.5;

                this.warningRings.forEach(ring => {
                    ring.material.uniforms.time.value = time;
                });

                const typhoonPositions = this.typhoonParticles.geometry.attributes.position;
                for (let i = 0; i < typhoonPositions.count; i++) {
                    const x = typhoonPositions.getX(i);
                    const z = typhoonPositions.getZ(i);

                    const distance = Math.sqrt(x * x + z * z);
                    const angle = Math.atan2(z, x);

                    typhoonPositions.setXYZ(
                        i,
                        x + Math.cos(angle + time) * 0.01 * this.windIntensity,
                        typhoonPositions.getY(i),
                        z + Math.sin(angle + time) * 0.01 * this.windIntensity
                    );
                }
                typhoonPositions.needsUpdate = true;

                const windPositions = this.windParticles.geometry.attributes.position;
                for (let i = 0; i < windPositions.count; i++) {
                    const x = windPositions.getX(i);
                    const z = windPositions.getZ(i);

                    const distance = Math.sqrt(x * x + z * z);
                    const angle = Math.atan2(z, x);

                    windPositions.setXYZ(
                        i,
                        x + Math.cos(angle + time * 2) * 0.02 * this.windIntensity,
                        windPositions.getY(i),
                        z + Math.sin(angle + time * 2) * 0.02 * this.windIntensity
                    );
                }
                windPositions.needsUpdate = true;
            }

            animate() {
                requestAnimationFrame(() => this.animate());

                this.update();
                this.controls.update();
                this.renderer.render(this.scene, this.camera);
            }

            setupEventListeners() {
                const container = document.getElementById('canvas-container');

                window.addEventListener('resize', () => {
                    const width = container.clientWidth;
                    const height = container.clientHeight;
                    this.camera.aspect = width / height;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(width, height);
                });

                container.addEventListener('mousemove', (event) => {
                    this.handleMouseMove(event);
                });

                window.addEventListener('keydown', (event) => {
                    const key = parseInt(event.key);
                    if (key >= 1 && key <= 5) {
                        this.windIntensity = key;
                    }
                });
            }
        }

        new TyphoonVisualization();
    </script>
</body>
</html>
