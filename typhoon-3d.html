<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Interactive 3D Typhoon Path Visualization</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
        }
        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
        }
        .flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0);
            pointer-events: none;
            z-index: 1000;
            transition: background-color 0.05s ease-out;
        }
        .flash-overlay.active {
            background-color: rgba(255, 255, 255, 0.6);
        }
        .control-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
        }
        .control-panel label {
            display: block;
            margin: 8px 0;
            cursor: pointer;
        }
        .control-panel input[type="checkbox"] {
            margin-right: 8px;
        }
    </style>
</head>

    <div id="ui" class="ui-overlay">
        <div>Use mouse to rotate/zoom</div>
        <div>Keys 1-5: Change Wind Intensity</div>
        <div>Key R: Toggle Rain</div>
        <div>Key E: Toggle Earth</div>
        <div>Key L: Toggle Lightning</div>
    </div>
    <div class="control-panel">
        <label><input type="checkbox" id="earthToggle" checked> Show Earth</label>
        <label><input type="checkbox" id="rainToggle" checked> Show Rain</label>
        <label><input type="checkbox" id="lightningToggle" checked> Enable Lightning</label>
    </div>
    <div id="flashOverlay" class="flash-overlay"></div>

    <script>

        class TyphoonVisualization {
            constructor() {
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.controls = null;

                this.typhoonParticles = null;
                this.windParticles = null;
                this.typhoonPath = null;
                this.windIntensity = 3;

                this.particleCount = 35000;
                this.windParticleCount = 500;
                this.animationSpeed = 0.001;

                this.earth = null;
                this.earthRotationSpeed = 0.0005;
                this.showEarth = true;

                this.rainParticles = null;
                this.rainParticleCount = 8000;
                this.showRain = true;

                this.lightningEnabled = true;
                this.lightningLight = null;
                this.lastLightningTime = 0;
                this.lightningInterval = 2000;
                this.lightningDuration = 100;
                this.lightningStartTime = 0;
                this.isLightningActive = false;
                this.originalTyphoonColors = null;

                this.typhoonPathData = [
                    { lat: 15.0, lon: 135.0 },
                    { lat: 16.5, lon: 133.0 },
                    { lat: 18.0, lon: 130.5 },
                    { lat: 20.0, lon: 127.0 },
                    { lat: 22.5, lon: 123.0 },
                    { lat: 24.0, lon: 120.0 },
                    { lat: 25.0, lon: 118.0 },
                    { lat: 26.0, lon: 116.0 },
                    { lat: 27.0, lon: 114.0 },
                    { lat: 28.0, lon: 112.0 }
                ];

                this.initialize();
                this.animate();
            }

            initialize() {
                this.setupScene();
                this.setupLights();
                this.createEarth();
                this.createOcean();
                this.createSky();
                this.createTyphoon();
                this.createWindField();
                this.createTyphoonPathOnEarth();
                this.createRainSystem();
                this.setupLightning();
                this.setupEventListeners();
            }

            setupScene() {
                this.scene = new THREE.Scene();
                this.scene.fog = new THREE.Fog(0x0a0f1f, 100, 1000);

                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
                this.camera.position.set(30, 20, 30);

                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(window.devicePixelRatio);
                document.body.appendChild(this.renderer.domElement);

                this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;
                this.controls.dampingFactor = 0.05;
            }

            setupLights() {
                const ambientLight = new THREE.AmbientLight(0x404060, 0.6);
                this.scene.add(ambientLight);

                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                directionalLight.position.set(50, 100, 50);
                this.scene.add(directionalLight);

                const eyeLight = new THREE.PointLight(0x4a90e2, 1.5, 100);
                eyeLight.position.set(0, 10, 0);
                this.scene.add(eyeLight);
            }

            createEarth() {
                const earthRadius = 50;
                const geometry = new THREE.SphereGeometry(earthRadius, 64, 64);

                const textureLoader = new THREE.TextureLoader();
                const earthTexture = textureLoader.load(
                    'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg',
                    () => {
                        console.log('Earth texture loaded');
                    }
                );

                const material = new THREE.MeshStandardMaterial({
                    map: earthTexture,
                    roughness: 0.8,
                    metalness: 0.1
                });

                this.earth = new THREE.Mesh(geometry, material);
                this.earth.position.set(0, -earthRadius + 5, 0);
                this.scene.add(this.earth);
            }

            latLonToXYZ(lat, lon, radius) {
                const phi = (90 - lat) * (Math.PI / 180);
                const theta = (lon + 180) * (Math.PI / 180);

                const x = -(radius * Math.sin(phi) * Math.cos(theta));
                const y = radius * Math.cos(phi);
                const z = radius * Math.sin(phi) * Math.sin(theta);

                return new THREE.Vector3(x, y, z);
            }

            createTyphoonPathOnEarth() {
                if (!this.earth) return;

                const earthRadius = 50;
                const pathPoints = [];
                const markers = [];

                this.typhoonPathData.forEach((point, index) => {
                    const pos = this.latLonToXYZ(point.lat, point.lon, earthRadius + 0.5);
                    pos.add(this.earth.position);
                    pathPoints.push(pos);

                    const markerGeometry = new THREE.SphereGeometry(0.8, 16, 16);
                    const markerMaterial = new THREE.MeshBasicMaterial({
                        color: index === 0 ? 0xff0000 : 0xff6600,
                        transparent: true,
                        opacity: 0.9
                    });
                    const marker = new THREE.Mesh(markerGeometry, markerMaterial);
                    marker.position.copy(pos);
                    this.scene.add(marker);
                    markers.push(marker);
                });

                const curve = new THREE.CatmullRomCurve3(pathPoints);
                const curvePoints = curve.getPoints(100);
                const pathGeometry = new THREE.BufferGeometry().setFromPoints(curvePoints);

                const pathMaterial = new THREE.LineBasicMaterial({
                    color: 0xffaa00,
                    transparent: true,
                    opacity: 0.8,
                    linewidth: 2
                });

                this.typhoonPath = new THREE.Line(pathGeometry, pathMaterial);
                this.scene.add(this.typhoonPath);
                this.typhoonMarkers = markers;

                const startPoint = pathPoints[0];
                const typhoonPos = this.latLonToXYZ(
                    this.typhoonPathData[0].lat,
                    this.typhoonPathData[0].lon,
                    earthRadius + 15
                );
                typhoonPos.add(this.earth.position);
                this.typhoonParticles.position.copy(typhoonPos);
            }

            createOcean() {
                const geometry = new THREE.PlaneGeometry(200, 200);
                const material = new THREE.MeshStandardMaterial({
                    color: 0x1e4072,
                    roughness: 0.1,
                    metalness: 0.3
                });
                const ocean = new THREE.Mesh(geometry, material);
                ocean.rotation.x = -Math.PI / 2;
                ocean.position.y = -5;
                this.scene.add(ocean);
            }

            createSky() {
                const starGeometry = new THREE.BufferGeometry();
                const starCount = 500;
                const starPositions = new Float32Array(starCount * 3);

                for (let i = 0; i < starCount * 3; i += 3) {
                    starPositions[i] = (Math.random() - 0.5) * 400;
                    starPositions[i + 1] = Math.random() * 200 + 20;
                    starPositions[i + 2] = (Math.random() - 0.5) * 400;
                }

                starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));

                const starMaterial = new THREE.PointsMaterial({
                    color: 0xffffff,
                    size: 0.5
                });

                const stars = new THREE.Points(starGeometry, starMaterial);
                this.scene.add(stars);
            }

            createTyphoon() {
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(this.particleCount * 3);
                const colors = new Float32Array(this.particleCount * 3);
                const sizes = new Float32Array(this.particleCount);

                const arms = 4;
                const eyeRadius = 3;

                for (let i = 0; i < this.particleCount; i++) {
                    const arm = Math.floor(i / (this.particleCount / arms));
                    const angle = (i / this.particleCount) * Math.PI * 2 * arms + arm * (Math.PI * 2 / arms);
                    const radius = Math.exp((angle * 0.3)) * 2;
                    const height = Math.random() * 15 + 2;

                    const x = Math.cos(angle) * radius;
                    const y = height;
                    const z = Math.sin(angle) * radius;

                    if (radius < eyeRadius) continue;

                    positions[i * 3] = x;
                    positions[i * 3 + 1] = y;
                    positions[i * 3 + 2] = z;

                    const distance = Math.sqrt(x * x + z * z);
                    const density = 1 - distance / 50;
                    const gray = Math.random() * 0.3 + 0.7;

                    colors[i * 3] = gray;
                    colors[i * 3 + 1] = gray;
                    colors[i * 3 + 2] = gray;

                    sizes[i] = (Math.random() * 0.3 + 0.1) * (1 + density);
                }

                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

                const material = new THREE.ShaderMaterial({
                    uniforms: {
                        time: { value: 0.0 }
                    },
                    vertexShader: `
                        attribute float size;
                        uniform float time;
                        varying vec3 vColor;

                        void main() {
                            vColor = color;
                            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                            gl_PointSize = size * (300.0 / -mvPosition.z);
                            gl_Position = projectionMatrix * mvPosition;
                        }
                    `,
                    fragmentShader: `
                        varying vec3 vColor;

                        void main() {
                            float distanceToCenter = distance(gl_PointCoord, vec2(0.5));
                            float strength = 1.0 - smoothstep(0.0, 0.5, distanceToCenter);
                            gl_FragColor = vec4(vColor, strength);
                        }
                    `,
                    blending: THREE.AdditiveBlending,
                    vertexColors: true,
                    transparent: true
                });

                this.typhoonParticles = new THREE.Points(geometry, material);
                this.scene.add(this.typhoonParticles);
            }

            createWindField() {
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(this.windParticleCount * 3);
                const colors = new Float32Array(this.windParticleCount * 3);

                for (let i = 0; i < this.windParticleCount; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const radius = Math.random() * 40 + 5;
                    const height = Math.random() * 10 + 2;

                    const x = Math.cos(angle) * radius;
                    const y = height;
                    const z = Math.sin(angle) * radius;

                    positions[i * 3] = x;
                    positions[i * 3 + 1] = y;
                    positions[i * 3 + 2] = z;

                    colors[i * 3] = 0.8;
                    colors[i * 3 + 1] = 0.9;
                    colors[i * 3 + 2] = 1.0;
                }

                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

                const material = new THREE.PointsMaterial({
                    size: 0.2,
                    vertexColors: true,
                    transparent: true,
                    blending: THREE.AdditiveBlending
                });

                this.windParticles = new THREE.Points(geometry, material);
                this.scene.add(this.windParticles);
            }

            createTyphoonPath() {
                const pathPoints = [];
                for (let i = 0; i < 50; i++) {
                    const angle = (i / 50) * Math.PI * 1.5;
                    const radius = 20 * (1 - i / 50);
                    pathPoints.push(
                        new THREE.Vector3(
                            Math.cos(angle) * radius - i * 0.5,
                            0,
                            Math.sin(angle) * radius * 0.5 + i * 0.3
                        )
                    );
                }

                const geometry = new THREE.BufferGeometry().setFromPoints(pathPoints);
                const material = new THREE.LineBasicMaterial({
                    color: 0xffaa00,
                    transparent: true,
                    opacity: 0.8
                });

                this.typhoonPath = new THREE.Line(geometry, material);
                this.scene.add(this.typhoonPath);

                for (let i = 0; i < pathPoints.length; i += 5) {
                    const marker = new THREE.Mesh(
                        new THREE.SphereGeometry(0.2, 8, 8),
                        new THREE.MeshBasicMaterial({ color: 0xff6600 })
                    );
                    marker.position.copy(pathPoints[i]);
                    this.scene.add(marker);
                }
            }

            createRainSystem() {
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(this.rainParticleCount * 3);
                const velocities = new Float32Array(this.rainParticleCount * 3);
                const sizes = new Float32Array(this.rainParticleCount);

                const typhoonCenter = this.typhoonParticles ? this.typhoonParticles.position : new THREE.Vector3(0, 10, 0);

                for (let i = 0; i < this.rainParticleCount; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const radiusFactor = Math.pow(Math.random(), 0.5);
                    const radius = radiusFactor * 30;

                    const x = typhoonCenter.x + Math.cos(angle) * radius;
                    const y = Math.random() * 25 + 5;
                    const z = typhoonCenter.z + Math.sin(angle) * radius;

                    positions[i * 3] = x;
                    positions[i * 3 + 1] = y;
                    positions[i * 3 + 2] = z;

                    velocities[i * 3] = 0;
                    velocities[i * 3 + 1] = -(0.3 + Math.random() * 0.2) * (1 + (1 - radiusFactor) * 0.5);
                    velocities[i * 3 + 2] = 0;

                    sizes[i] = Math.random() * 0.5 + 0.3;
                }

                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('velocity', new THREE.BufferAttribute(velocities, 3));
                geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

                const material = new THREE.ShaderMaterial({
                    uniforms: {
                        time: { value: 0.0 }
                    },
                    vertexShader: `
                        attribute float size;
                        attribute vec3 velocity;
                        varying float vAlpha;
                        varying vec2 vUv;

                        void main() {
                            vAlpha = 0.6;
                            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                            gl_PointSize = size * (200.0 / -mvPosition.z);
                            gl_Position = projectionMatrix * mvPosition;
                        }
                    `,
                    fragmentShader: `
                        varying float vAlpha;

                        void main() {
                            vec2 center = gl_PointCoord - vec2(0.5);
                            float dist = length(center);
                            float alpha = smoothstep(0.5, 0.0, dist) * vAlpha;
                            vec3 color = vec3(0.4, 0.6, 0.9);
                            gl_FragColor = vec4(color, alpha);
                        }
                    `,
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });

                this.rainParticles = new THREE.Points(geometry, material);
                this.rainVelocities = velocities;
                this.scene.add(this.rainParticles);
            }

            updateRain() {
                if (!this.rainParticles || !this.showRain) return;

                const positions = this.rainParticles.geometry.attributes.position;
                const velocities = this.rainVelocities;
                const typhoonCenter = this.typhoonParticles ? this.typhoonParticles.position : new THREE.Vector3(0, 10, 0);

                for (let i = 0; i < this.rainParticleCount; i++) {
                    let x = positions.getX(i);
                    let y = positions.getY(i);
                    let z = positions.getZ(i);

                    const dx = x - typhoonCenter.x;
                    const dz = z - typhoonCenter.z;
                    const distance = Math.sqrt(dx * dx + dz * dz);
                    const angle = Math.atan2(dz, dx);

                    const windInfluence = Math.max(0, 1 - distance / 30) * 0.05 * this.windIntensity;

                    x += Math.cos(angle + Math.PI / 2) * windInfluence + velocities[i * 3];
                    y += velocities[i * 3 + 1] * (1 + (1 - distance / 30) * 0.5);
                    z += Math.sin(angle + Math.PI / 2) * windInfluence + velocities[i * 3 + 2];

                    if (y < -5) {
                        const newAngle = Math.random() * Math.PI * 2;
                        const radiusFactor = Math.pow(Math.random(), 0.5);
                        const radius = radiusFactor * 30;

                        x = typhoonCenter.x + Math.cos(newAngle) * radius;
                        y = 25 + Math.random() * 5;
                        z = typhoonCenter.z + Math.sin(newAngle) * radius;

                        velocities[i * 3 + 1] = -(0.3 + Math.random() * 0.2) * (1 + (1 - radiusFactor) * 0.5);
                    }

                    positions.setXYZ(i, x, y, z);
                }

                positions.needsUpdate = true;
            }

            setupLightning() {
                this.lightningLight = new THREE.PointLight(0xaaccff, 0, 300);
                this.lightningLight.position.set(0, 20, 0);
                this.scene.add(this.lightningLight);

                this.flashOverlay = document.getElementById('flashOverlay');

                this.lightningBolts = [];
                this.createLightningBolt();
            }

            createLightningBolt() {
                const points = [];
                const segments = 15;
                const typhoonPos = this.typhoonParticles ? this.typhoonParticles.position : new THREE.Vector3(0, 15, 0);
                
                let y = typhoonPos.y + 10;
                let x = typhoonPos.x;
                let z = typhoonPos.z;
                
                points.push(new THREE.Vector3(x, y, z));
                
                for (let i = 0; i < segments; i++) {
                    y -= (20 / segments);
                    x += (Math.random() - 0.5) * 3;
                    z += (Math.random() - 0.5) * 3;
                    points.push(new THREE.Vector3(x, y, z));
                }

                const geometry = new THREE.BufferGeometry().setFromPoints(points);
                const material = new THREE.LineBasicMaterial({
                    color: 0xaaccff,
                    transparent: true,
                    opacity: 0,
                    linewidth: 2
                });

                const bolt = new THREE.Line(geometry, material);
                this.scene.add(bolt);
                this.lightningBolts.push(bolt);
            }

            triggerLightning() {
                if (!this.lightningEnabled || this.isLightningActive) return;

                const currentTime = Date.now();
                if (currentTime - this.lastLightningTime < this.lightningInterval) return;

                this.isLightningActive = true;
                this.lightningStartTime = currentTime;
                this.lastLightningTime = currentTime;

                const typhoonPos = this.typhoonParticles ? this.typhoonParticles.position : new THREE.Vector3(0, 15, 0);
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * 15;
                this.lightningLight.position.set(
                    typhoonPos.x + Math.cos(angle) * radius,
                    typhoonPos.y + Math.random() * 10,
                    typhoonPos.z + Math.sin(angle) * radius
                );

                this.lightningLight.intensity = 8;
                this.flashOverlay.classList.add('active');

                this.updateLightningBolt(typhoonPos);

                this.setTyphoonLightningColor(true);

                this.lightningInterval = 2000 + Math.random() * 3000;
            }

            updateLightningBolt(typhoonPos) {
                if (this.lightningBolts.length === 0) return;

                const bolt = this.lightningBolts[0];
                const positions = bolt.geometry.attributes.position;
                
                let y = typhoonPos.y + 10;
                let x = typhoonPos.x + (Math.random() - 0.5) * 10;
                let z = typhoonPos.z + (Math.random() - 0.5) * 10;
                
                positions.setXYZ(0, x, y, z);
                
                for (let i = 1; i < positions.count; i++) {
                    y -= (20 / (positions.count - 1));
                    x += (Math.random() - 0.5) * 4;
                    z += (Math.random() - 0.5) * 4;
                    positions.setXYZ(i, x, y, z);
                }
                positions.needsUpdate = true;
                
                bolt.material.opacity = 1;
            }

            setTyphoonLightningColor(isLightning) {
                if (!this.typhoonParticles) return;

                const colors = this.typhoonParticles.geometry.attributes.color;

                if (isLightning) {
                    if (!this.originalTyphoonColors) {
                        this.originalTyphoonColors = new Float32Array(colors.array.length);
                        this.originalTyphoonColors.set(colors.array);
                    }

                    for (let i = 0; i < colors.count; i++) {
                        const blueWhite = 0.85 + Math.random() * 0.15;
                        colors.setXYZ(i, blueWhite, blueWhite, 1.0);
                    }
                    colors.needsUpdate = true;
                } else if (this.originalTyphoonColors) {
                    colors.array.set(this.originalTyphoonColors);
                    colors.needsUpdate = true;
                }
            }

            updateLightning() {
                if (!this.isLightningActive) {
                    this.triggerLightning();
                    return;
                }

                const elapsed = Date.now() - this.lightningStartTime;

                if (elapsed < this.lightningDuration) {
                    const progress = elapsed / this.lightningDuration;
                    
                    if (progress < 0.3) {
                        const flicker = Math.random() > 0.5 ? 1 : 0.4;
                        this.lightningLight.intensity = 8 * flicker;
                        if (this.lightningBolts.length > 0) {
                            this.lightningBolts[0].material.opacity = flicker;
                        }
                    } else {
                        const fadeProgress = (progress - 0.3) / 0.7;
                        this.lightningLight.intensity = 8 * (1 - fadeProgress) * 0.5;
                        if (this.lightningBolts.length > 0) {
                            this.lightningBolts[0].material.opacity = 1 - fadeProgress;
                        }
                        this.flashOverlay.classList.remove('active');
                    }
                } else {
                    this.lightningLight.intensity = 0;
                    this.flashOverlay.classList.remove('active');
                    if (this.lightningBolts.length > 0) {
                        this.lightningBolts[0].material.opacity = 0;
                    }
                    this.setTyphoonLightningColor(false);
                    this.isLightningActive = false;
                }
            }

            update() {
                const time = Date.now() * this.animationSpeed;

                if (this.earth && this.showEarth) {
                    this.earth.rotation.y += this.earthRotationSpeed;
                }

                this.typhoonParticles.rotation.y += this.animationSpeed * 0.5;

                const typhoonPositions = this.typhoonParticles.geometry.attributes.position;
                for (let i = 0; i < typhoonPositions.count; i++) {
                    const x = typhoonPositions.getX(i);
                    const z = typhoonPositions.getZ(i);

                    const distance = Math.sqrt(x * x + z * z);
                    const angle = Math.atan2(z, x);

                    typhoonPositions.setXYZ(
                        i,
                        x + Math.cos(angle + time) * 0.01 * this.windIntensity,
                        typhoonPositions.getY(i),
                        z + Math.sin(angle + time) * 0.01 * this.windIntensity
                    );
                }
                typhoonPositions.needsUpdate = true;

                const windPositions = this.windParticles.geometry.attributes.position;
                for (let i = 0; i < windPositions.count; i++) {
                    const x = windPositions.getX(i);
                    const z = windPositions.getZ(i);

                    const distance = Math.sqrt(x * x + z * z);
                    const angle = Math.atan2(z, x);

                    windPositions.setXYZ(
                        i,
                        x + Math.cos(angle + time * 2) * 0.02 * this.windIntensity,
                        windPositions.getY(i),
                        z + Math.sin(angle + time * 2) * 0.02 * this.windIntensity
                    );
                }
                windPositions.needsUpdate = true;

                this.updateRain();

                this.updateLightning();
            }

            animate() {
                requestAnimationFrame(() => this.animate());

                this.update();
                this.controls.update();
                this.renderer.render(this.scene, this.camera);
            }

            setupEventListeners() {
                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });

                window.addEventListener('keydown', (event) => {
                    const key = parseInt(event.key);
                    if (key >= 1 && key <= 5) {
                        this.windIntensity = key;
                    }

                    if (event.key.toLowerCase() === 'r') {
                        this.showRain = !this.showRain;
                        if (this.rainParticles) {
                            this.rainParticles.visible = this.showRain;
                        }
                        document.getElementById('rainToggle').checked = this.showRain;
                    }

                    if (event.key.toLowerCase() === 'e') {
                        this.showEarth = !this.showEarth;
                        if (this.earth) {
                            this.earth.visible = this.showEarth;
                        }
                        document.getElementById('earthToggle').checked = this.showEarth;
                    }

                    if (event.key.toLowerCase() === 'l') {
                        this.lightningEnabled = !this.lightningEnabled;
                        document.getElementById('lightningToggle').checked = this.lightningEnabled;
                    }
                });

                document.getElementById('earthToggle').addEventListener('change', (e) => {
                    this.showEarth = e.target.checked;
                    if (this.earth) {
                        this.earth.visible = this.showEarth;
                    }
                });

                document.getElementById('rainToggle').addEventListener('change', (e) => {
                    this.showRain = e.target.checked;
                    if (this.rainParticles) {
                        this.rainParticles.visible = this.showRain;
                    }
                });

                document.getElementById('lightningToggle').addEventListener('change', (e) => {
                    this.lightningEnabled = e.target.checked;
                });
            }
        }

        new TyphoonVisualization();
    </script>
</body>
</html>
